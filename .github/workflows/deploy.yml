# main dalına her push'ta siteyi FTP ile sunucudaki kahve-qr klasörüne yükler.
# Gerekli GitHub Secrets: FTP_SERVER, FTP_USERNAME, FTP_PASSWORD
# Hedef klasör (server-dir) FTP hesabının kök dizinine göredir; kök dizin sitenin public_html klasörüdür.
name: Sunucuya yükle

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: FTP ile yükle
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER || vars.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME || vars.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD || vars.FTP_PASSWORD }}
          server-dir: kahve-qr/
          protocol: ftps
          exclude: |
            **/.git*
            **/.git*/**
            .github/**
            .firebaserc
            firebase.json
            firestore.rules
            README.md
