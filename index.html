<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#080808">
  <meta name="description" content="">
  <title>QR Menü</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 64 64%27%3E%3Ccircle cx=%2732%27 cy=%2732%27 r=%2730%27 fill=%27%23080808%27 stroke=%27%23fff%27 stroke-width=%272%27/%3E%3Cpath d=%27M22 44c10 2 20-6 20-18%27 fill=%27none%27 stroke=%27%23fff%27 stroke-width=%273%27 stroke-linecap=%27round%27/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="assets/css/site.css?v=3">
</head>
<body class="is-intro">

  <!-- Zeminde dönen video -->
  <div class="bg" aria-hidden="true">
    <video id="bgVideo" muted loop playsinline preload="auto"></video>
    <div class="bg__veil"></div>
    <div class="bg__grain"></div>
  </div>

  <!-- Karşılama videosu -->
  <section class="intro" id="intro" aria-label="Karşılama"></section>

  <header class="nav" id="nav"></header>

  <main id="main">
    <section class="hero" id="top"></section>
    <section class="menu" id="menu" aria-label="Menü">
      <div class="chips" id="chips" role="tablist"></div>
      <div class="grid" id="grid"></div>
      <p class="menu__note" id="menuNote"></p>
    </section>
    <section class="block" id="about"></section>
    <section class="block" id="promise"></section>
    <section class="block" id="visit"></section>
  </main>

  <footer class="footer" id="footer"></footer>

  <!-- Ürün detayı -->
  <div class="detail" id="detail" role="dialog" aria-modal="true" hidden>
    <div class="detail__scroll" id="detailBody"></div>
    <button class="detail__close" id="detailClose" type="button">
      <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M5 5l14 14M19 5L5 19" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
    </button>
  </div>

  <script src="assets/js/defaults.js?v=3"></script>
  <script src="assets/js/store.js?v=3"></script>
  <script src="assets/js/firebase-config.js?v=3"></script>
  <script src="assets/js/cloud.js?v=3"></script>
  <script src="assets/js/site.js?v=3"></script>
</body>
</html>
